name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android/**
      - src/**
      - public/**
      - package.json
      - package-lock.json
      - capacitor.config.json

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build and sync Android
        run: npm run build && npx cap sync android

      - name: Allow Gradle wrapper execution
        run: chmod +x android/gradlew

      - name: Test and assemble debug APK
        run: ./android/gradlew -p android --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smartquiz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
