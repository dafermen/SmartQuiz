name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ios.yml
      - ios/**
      - src/**
      - public/**
      - package.json
      - package-lock.json
      - capacitor.config.json

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and sync iOS
        run: npm run build && npx cap sync ios

      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
